              // Skulle indeksen likevel peike på Driver medan den er sperra, flytt til 5-Wood.
              if (driverBlocked && CADDIE_CLUBS[shownIdx] === "Driver") shownIdx = caddieIndexOf("5-Wood");
              const shownClub = CADDIE_CLUBS[shownIdx] || autoClub;
              const disp = CLUB_DISPERSION[shownClub];
              const hasElev = playsLike != null && playsLike !== distToHole;
              return (
                <div style={{ background: "#1a3a25", borderRadius: 14, padding: "16px 18px", marginBottom: 8, color: "#fff" }}>
                  {/* Avstand til flagg */}
                  <div style={{ textAlign: "center", marginBottom: 12 }}>
                    <div style={{ fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", color: "rgba(255,255,255,0.6)", fontWeight: 700 }}>Avstand til flagg</div>
                    <div style={{ fontSize: 52, fontWeight: 800, color: "#fff", fontFamily: NUM_FONT, lineHeight: 1.0, marginTop: 2 }}>
                      {hasElev ? playsLike : distToHole}<span style={{ fontSize: 24, fontWeight: 600 }}>m</span>
                    </div>
                    {hasElev && (
                      <div style={{ fontSize: 13, color: "rgba(255,255,255,0.7)", fontWeight: 600, marginTop: 2, fontFamily: NUM_FONT }}>
                        {distToHole}m flatt · {elevDiffToGreen > 0 ? "↗ spelar opp" : "↘ spelar ned"}
                      </div>
                    )}
                  </div>
                  {/* Kølleforslag med bla-knappar og aksept */}
                  <div style={{ background: "rgba(255,255,255,0.1)", borderRadius: 10, padding: "12px 14px" }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
                      {caddieMode && !showAllClubs ? (
                        <button onClick={()=>{
                          // ◀ = lengre kølle (lågare indeks, sirkulært).
                          // Hopp over Driver når han er sperra (frå slag 2).
                          let newIdx = (shownIdx - 1 + CADDIE_CLUBS.length) % CADDIE_CLUBS.length;
                          if (driverBlocked && CADDIE_CLUBS[newIdx] === "Driver")
                            newIdx = (newIdx - 1 + CADDIE_CLUBS.length) % CADDIE_CLUBS.length;
                          setCaddieIndex(newIdx);
                          setSelectedClub(CADDIE_CLUBS[newIdx]);
                        }} style={{
                          padding: "14px 16px", background: "rgba(255,255,255,0.15)", border: "2px solid rgba(255,255,255,0.4)",
                          borderRadius: 10, fontSize: 20, fontWeight: 700, color: "#fff", cursor: "pointer", minWidth: 52,
                        }}>◀</button>
                      ) : <div style={{ minWidth: 52 }} />}
                      <div style={{ flex: 1, textAlign: "center" }}>
                        <div style={{ fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase", color: "rgba(255,255,255,0.6)", fontWeight: 700 }}>
                          {caddieMode && caddieIndex !== null ? "Vald kølle" : "Foreslått"}
                        </div>
                        <div style={{ fontSize: 34, fontWeight: 800, color: "#ffd24a", fontFamily: NUM_FONT, lineHeight: 1.05 }}>{shownClub}</div>
                        {disp && (
                          <div style={{ fontSize: 13, color: "rgba(255,255,255,0.85)", fontWeight: 600, marginTop: 2, fontFamily: NUM_FONT }}>
                            carry {disp.carry}m · ±{Math.round(disp.sideStd)}m sideveis
                          </div>
                        )}
                      </div>
                      {caddieMode && !showAllClubs ? (
                        <button onClick={()=>{
                          // ▶ = kortare kølle (høgare indeks, sirkulært).
                          // Hopp over Driver når han er sperra (frå slag 2).
                          let newIdx = (shownIdx + 1) % CADDIE_CLUBS.length;
                          if (driverBlocked && CADDIE_CLUBS[newIdx] === "Driver")
                            newIdx = (newIdx + 1) % CADDIE_CLUBS.length;
                          setCaddieIndex(newIdx);
                          setSelectedClub(CADDIE_CLUBS[newIdx]);
                        }} style={{
                          padding: "14px 16px", background: "rgba(255,255,255,0.15)", border: "2px solid rgba(255,255,255,0.4)",
                          borderRadius: 10, fontSize: 20, fontWeight: 700, color: "#fff", cursor: "pointer", minWidth: 52,
                        }}>▶</button>
                      ) : <div style={{ minWidth: 52 }} />}
                    </div>
                    {/* Aksept-knapp */}
                    <button onClick={()=>{
                      handleSelectClub(shownClub);
                      setCaddieIndex(null);
                    }} style={{
                      width: "100%", marginTop: 12, padding: "15px", background: "#ffd24a",
                      border: "none", borderRadius: 10, color: "#1a3a25", fontSize: 18, fontWeight: 800, cursor: "pointer",
                    }}>Vel {shownClub} →</button>
                  </div>
                </div>
              );
            })()}

            {/* Loop-veljar: berre synleg for Sunnfjord (delt bane) og før første slag */}
            {hasLoop && holes.length === 0 && currentShots.length === 0 && (
              <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 14px", marginBottom: 10, background: "#fff", borderRadius: 10, border: "2px solid #c8b48c" }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, color: "#666", fontWeight: 600 }}>Du startar med:</div>
                  <div style={{ fontSize: 17, fontWeight: 700, color: "#1a3a25" }}>
                    {loop === "front" ? "Front 9 (hol 1–9)" : "Back 9 (hol 10–18)"}
                  </div>
                </div>
                <button onClick={()=>{
                  const newLoop = loop === "front" ? "back" : "front";
                  const newStartHole = newLoop === "front" ? 1 : 10;
                  setLoop(newLoop);
                  setCurrentHole(newStartHole);
                  setLastPos(teePositions[newStartHole - 1]);
                  try { localStorage.setItem("golf-loop", newLoop); } catch(e){}
                }} style={{
                  padding: "10px 14px", background: "#1a3a25", border: "none",
                  borderRadius: 8, color: "#fff", fontSize: 14, fontWeight: 700, cursor: "pointer",
                }}>
                  Byt til {loop === "front" ? "Back 9" : "Front 9"}
                </button>
              </div>
            )}

            {/* Melding */}
            {message && <div style={{ background: "#e8f5e9", border: "2px solid #4a8c5c", borderRadius: 10, padding: "12px 16px", marginBottom: 10, fontSize: 15, lineHeight: 1.5, color: "#1a3a25", fontWeight: 600 }}>{message}</div>}

            {/* Kart — alltid synleg */}
            <div style={{ marginBottom: 10 }}>
              <GolfMap currentHole={view==="calibrate"?calHole:currentHole} lastPos={lastPos} onPlaceBall={handlePlaceBall} currentShots={currentShots} holes={holes} teePositions={teePositions} greenPositions={greenPositions} calibrateMode={view==="calibrate"} calibrateStep={calStep} onCalibrateTap={handleCalibrateTap} selectedClub={selectedClub} aimPoint={aimPoint} userPosition={userPosition} courseCenter={activeCourseCenter} holeIntermediates={osmIntermediates} />

              {/* GPS-knapp under kartet. I "map"-steg med vald kølle brukar han
                  GPS-en DIREKTE som slagposisjon. Elles berre viser kvar du er. */}
              <button
                onClick={()=>handleUseGPS(step === "map" && !!selectedClub)}
                disabled={gpsStatus === "fetching"}
                style={{
                  width: "100%", marginTop: 6, padding: "14px",
                  borderRadius: 10, cursor: gpsStatus === "fetching" ? "wait" : "pointer",
                  background: gpsStatus === "fetching" ? "#f0f0f0"
                            : (step === "map" && selectedClub) ? "#1a3a25" : "#fff",
                  border: "2px solid #1a3a25",
                  color: (step === "map" && selectedClub) ? "#fff" : "#1a3a25",
                  fontSize: 15, fontWeight: 700,
                  display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
                }}
              >
                {gpsStatus === "fetching" ? (
                  <>📡 Hentar GPS...</>
                ) : (step === "map" && selectedClub) ? (
                  <>📍 Bruk min GPS som ballposisjon</>
                ) : (
                  <>📍 Vis meg på kartet</>
                )}
              </button>

              {step === "map" && (
                <div style={{ textAlign: "center", marginTop: 6 }}>
                  <div style={{ fontSize: 14, fontWeight: 700, color: aimMode ? "#cc0000" : "#1a3a25" }}>
                    {aimMode ? "🎯 Trykk på kartet for å velje sikteretning" : "eller trykk på kartet der ballen landa"}
                  </div>
                  <button onClick={()=>{
                    if (aimMode) { setAimMode(false); setMessage(`Siktemodus avslutta`); }
                    else { setAimMode(true); setMessage(`🎯 Trykk på kartet der du vil sikte`); }
                  }} style={{
                    marginTop: 6, padding: "8px 20px", borderRadius: 8, cursor: "pointer",
                    background: aimMode ? "#ffebee" : (aimPoint ? "#e8f5e9" : "#fff"),
                    border: aimMode ? "2px solid #cc0000" : (aimPoint ? "2px solid #2d8a4e" : "1px solid #ccc"),
                    color: aimMode ? "#cc0000" : (aimPoint ? "#2d8a4e" : "#666"),
                    fontSize: 13, fontWeight: 600,
                  }}>
                    {aimMode ? "✕ Avbryt sikte" : (aimPoint ? "🎯 Endre sikte (aktiv)" : "🎯 Endre sikteretning")}
                  </button>
                </div>
              )}
            </div>


            {/* Runden er ferdig: ingen fleire hol å registrere på */}
            {roundComplete && (
              <div style={{ background: "#fff", border: "2px solid #1a3a25", borderRadius: 10, padding: "14px 16px", marginBottom: 10, textAlign: "center", fontSize: 15, fontWeight: 700, color: "#1a3a25" }}>
                ⛳ Alle hol er ferdige — avslutt runden nedanfor
              </div>
            )}

            {/* Slag-handlingar: på green, chip-in, straff, pickup, og full kølle-grid */}
            {step === "club" && !roundComplete && (
              <div>
                <div style={{ fontSize: 13, letterSpacing: "0.08em", textTransform: "uppercase", color: "#666", fontWeight: 700, marginBottom: 8, textAlign: "center" }}>
                  Slag {currentShots.length+1}
                </div>

                {/* På green — tel puttar.
                    Hovudvegen ut av holet for vanleg spel. Ingen GPS, ingen kart-trykk —
                    berre tal-knappar 1, 2, 3 eller 4 puttar.
                    Puttane blir lagt til som syntetiske slag i currentShots med kølle="Putt"
                    og putt:true-flagg, slik at score-telling fungerer som vanleg, men puttar
                    kan filtrerast ut i statistikk seinare. */}
                {currentShots.length > 0 && !showPuttPicker && <button onClick={()=>{
                  setShowPuttPicker(true);
                  setPendingPutts(null);
                  setShowPickup(false);
                  setMessage("");
                }} style={{
                  width: "100%", padding: "16px 16px", marginBottom: 8,
                  background: "#e8f5e9", border: "3px solid #4a8c5c",
                  borderRadius: 10, cursor: "pointer", display: "flex", alignItems: "center", gap: 12,
                }}>
                  <span style={{ width: 30, height: 30, borderRadius: "50%", background: "#4a8c5c", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>⛳</span>
                  <span style={{ fontSize: 16, color: "#1a3a25", fontWeight: 700 }}>På green — tel puttar</span>
                </button>}

                {/* Putt-velgar, steg 1: tal puttar (1, 2, 3, 4).
                    Lukkar IKKJE holet lenger — går til steg 2 (avstand). */}
                {showPuttPicker && pendingPutts === null && (
                  <div style={{ background: "#fff", border: "3px solid #4a8c5c", borderRadius: 10, padding: "14px", marginBottom: 8 }}>
                    <div style={{ fontSize: 14, fontWeight: 700, color: "#1a3a25", marginBottom: 10, textAlign: "center" }}>Kor mange puttar?</div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8 }}>
                      {[1, 2, 3, 4].map(n => (
                        <button key={n} onClick={()=>setPendingPutts(n)} style={{
                          padding: "20px 6px", borderRadius: 10, cursor: "pointer",
                          background: "#fff", border: "2px solid #4a8c5c",
                          color: "#1a3a25", fontSize: 22, fontWeight: 700,
                        }}>{n}</button>
                      ))}
                    </div>
                    <button onClick={()=>{ setShowPuttPicker(false); }} style={{
                      width: "100%", marginTop: 10, padding: "8px",
                      background: "#fff", border: "1px solid #999", borderRadius: 8,
                      color: "#666", fontSize: 13, fontWeight: 600, cursor: "pointer",
                    }}>Avbryt</button>
                  </div>
                )}

                {/* Putt-velgar, steg 2: avstand frå flagget ved første putt.
                    Valet her lukkar holet og går vidare. Ingen «hopp over» —
                    berre «Tilbake» for å rette puttalet. */}
                {showPuttPicker && pendingPutts !== null && (
                  <div style={{ background: "#fff", border: "3px solid #4a8c5c", borderRadius: 10, padding: "14px", marginBottom: 8 }}>
                    <div style={{ fontSize: 14, fontWeight: 700, color: "#1a3a25", marginBottom: 2, textAlign: "center" }}>Første putt — avstand frå flagget?</div>
                    <div style={{ fontSize: 12, color: "#666", marginBottom: 10, textAlign: "center", fontFamily: NUM_FONT }}>{pendingPutts} putt{pendingPutts > 1 ? "ar" : ""} valt</div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8 }}>
                      {PUTT_DISTANCES.map(({ value, label }, di) => (
                        <button key={value} onClick={()=>{
                          const n = pendingPutts;
                          // Legg til n puttar som syntetiske slag. Første putt får
                          // toHole = vald avstand, siste putt får toHole: 0 (hole-out).
                          // Ved 1 putt er første og siste same slag — då vinn 0 som
                          // hole-out-markør, og avstanden blir lagra i `puttDist`.
                          // `puttDist` ligg alltid på putt 1 slik at analysen i Sheets
                          // kan bruke det feltet uavhengig av puttalet.
                          // Pos = green-posisjon (best mogleg estimat — ingen GPS-trykk).
                          const pos = greenPos || lastPos;
                          const newPutts = [];
                          for (let i = 0; i < n; i++) {
                            const isFirst = i === 0, isLast = i === n - 1;
                            newPutts.push({
                              club: "Putt",
                              pos,
                              distance: null,
                              toHole: isLast ? 0 : isFirst ? value : null,
                              shotNumber: currentShots.length + i + 1,
                              putt: true,
                              puttDist: isFirst ? value : null,
                            });
                          }
                          const updatedShots = [...currentShots, ...newPutts];
                          const score = updatedShots.length;
                          const diff = score - holeInfo.par;
                          const scoreLbl = diff<=-2?"Eagle!":diff===-1?"Birdie!":diff===0?"Par":diff===1?"Bogey":diff===2?"Dobbel-bogey":`+${diff}`;
                          setHoles(prev => [...prev, { hole: currentHole, shots: updatedShots }]);
                          setCurrentShots([]);
                          const endNote = advanceHole() || "";
                          setMessage(`⛳ Hol ${currentHole} ferdig! ${score} slag (${n}-putt frå ${label}) — ${scoreLbl}${endNote}`);
                          window.scrollTo({ top: 0, behavior: "smooth" });
                        }} style={{
                          gridColumn: di === PUTT_DISTANCES.length - 1 ? "span 2" : "auto",
                          padding: "18px 4px", borderRadius: 10, cursor: "pointer",
                          background: "#fff", border: "2px solid #4a8c5c",
                          color: "#1a3a25", fontSize: 18, fontWeight: 700, fontFamily: NUM_FONT,
                        }}>{label}</button>
                      ))}
                    </div>
                    <button onClick={()=>setPendingPutts(null)} style={{
                      width: "100%", marginTop: 10, padding: "8px",
                      background: "#fff", border: "1px solid #999", borderRadius: 8,
                      color: "#666", fontSize: 13, fontWeight: 600, cursor: "pointer",
                    }}>← Tilbake (rett tal puttar)</button>
                  </div>
                )}

                {/* Ballen er i holet — markerer siste slag som hole-out (chip-in, hole-out frå avstand) */}
                {currentShots.length > 0 && !showPuttPicker && <button onClick={()=>{
                  // Marker siste registrerte slag som hole-out (toHole: 0).
                  // Ingen nytt slag blir lagt til — siste slag er det som førte ballen i holet,
                  // anten det var ein putt, ein chip med SW, eller eit langt jern.
                  // Bruk-tellaren for sist valde kølle er allereie oppdatert då slaget
                  // vart registrert, så vi rører ikkje clubUsage her.
                  const updatedShots = [...currentShots];
                  const lastIdx = updatedShots.length - 1;
                  updatedShots[lastIdx] = { ...updatedShots[lastIdx], toHole: 0 };
                  const score = updatedShots.length;
                  const diff = score - holeInfo.par;
                  const label = diff<=-2?"Eagle!":diff===-1?"Birdie!":diff===0?"Par":diff===1?"Bogey":diff===2?"Dobbel-bogey":`+${diff}`;
                  setHoles(prev => [...prev, { hole: currentHole, shots: updatedShots }]);
                  setCurrentShots([]);
                  const endNote = advanceHole() || "";
                  setMessage(`⛳ Hol ${currentHole} ferdig! ${score} slag — ${label}${endNote}`);
                  window.scrollTo({ top: 0, behavior: "smooth" });
                }} style={{
                  width: "100%", padding: "16px 16px", marginBottom: 8,
                  background: "#fff3cd", border: "3px solid #e6a800",
                  borderRadius: 10, cursor: "pointer", display: "flex", alignItems: "center", gap: 12,
                }}>
                  <span style={{ width: 30, height: 30, borderRadius: "50%", background: "#e6a800", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>🎯</span>
                  <span style={{ fontSize: 14, color: "#8a6500", fontWeight: 700 }}>Siste slag gjekk i holet (chip-in)</span>
                </button>}

                {/* Straffeslag og pickup */}
                {currentShots.length > 0 && !confirmStraff && (
                  <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
                    <button onClick={()=>setConfirmStraff(true)} style={{
                      flex: 1, padding: "12px 8px", borderRadius: 10, cursor: "pointer",
                      background: "#fff", border: "2px solid #cc6600",
                      display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
                    }}>
                      <span style={{ fontSize: 16 }}>⚠️</span>
                      <span style={{ fontSize: 13, color: "#cc6600", fontWeight: 700 }}>Straff +1</span>
                    </button>
                    <button onClick={()=>setShowPickup(v=>!v)} style={{
                      flex: 1, padding: "12px 8px", borderRadius: 10, cursor: "pointer",
                      background: showPickup ? "#ffebee" : "#fff", border: "2px solid #cc4444",
                      display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
                    }}>
                      <span style={{ fontSize: 16 }}>🏳️</span>
                      <span style={{ fontSize: 13, color: "#cc4444", fontWeight: 700 }}>Pickup</span>
                    </button>
                  </div>
                )}

                {/* Straffeslag-bekrefting. Lagt til 02.05.2026 etter at brukar
                    rapporterte at straffeslag burde krevje bekrefting.
                    Omskrive 28.08.2026: bekreftinga er no eit årsaksval. Å velje ein
                    årsaksknapp ER bekreftinga, så flyten er framleis to trykk
                    (Straff +1 → årsak) og gir same vern mot feiltrykk som før. */}
                {confirmStraff && (
                  <div style={{ background: "#fff", border: "2px solid #cc6600", borderRadius: 12, padding: "16px", marginBottom: 8 }}>
                    <div style={{ fontSize: 16, fontWeight: 700, color: "#1a1a1a", marginBottom: 4, textAlign: "center" }}>Kva slags straff?</div>
                    <div style={{ fontSize: 13, color: "#666", marginBottom: 14, textAlign: "center" }}>Score blir auka med 1</div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                      {PENALTY_REASONS.map((reason, ri) => (
                        <button key={reason.key} onClick={()=>{
                          const lastShot = currentShots[currentShots.length - 1];
                          const pos = lastShot?.pos || lastPos;
                          const shot = { club: "Straff", pos, distance: null, toHole: lastShot?.toHole || null, shotNumber: currentShots.length + 1, penalty: true, penaltyReason: reason.key };
                          setCurrentShots(prev => [...prev, shot]);
                          setMessage(`⚠️ Straffeslag (${reason.label}) lagt til — no ${currentShots.length + 1} slag`);
                          setConfirmStraff(false);
                        }} style={{
                          gridColumn: ri === PENALTY_REASONS.length - 1 ? "1 / -1" : "auto",
                          minHeight: 52, padding: "14px 8px",
                          background: "#cc6600", border: "2px solid #cc6600", borderRadius: 8,
                          color: "#fff", fontSize: 15, fontWeight: 700, cursor: "pointer",
                          fontFamily: NUM_FONT,
                        }}>{reason.label}</button>
                      ))}
                    </div>
                    <button onClick={()=>setConfirmStraff(false)} style={{ width: "100%", marginTop: 8, padding: "12px", background: "#fff", border: "2px solid #ccc", borderRadius: 8, color: "#666", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>Avbryt</button>
                  </div>
                )}

                {/* Pickup-val */}
                {showPickup && (
                  <div style={{ background: "#fff", border: "2px solid #cc4444", borderRadius: 10, padding: "14px", marginBottom: 8 }}>
                    <div style={{ fontSize: 14, fontWeight: 700, color: "#cc4444", marginBottom: 8, textAlign: "center" }}>Vel score for holet</div>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "center" }}>
                      {(() => {
                        const par = holeInfo.par;
                        const minScore = Math.max(currentShots.length + 1, par + 1);
                        const options = [];
                        for (let s = minScore; s <= par * 2 + 2; s++) {
                          const diff = s - par;
                          const label = diff === 1 ? "Bogey" : diff === 2 ? "Dbl-bogey" : `+${diff}`;
                          options.push({ score: s, label });
                        }
                        return options.map(opt => (
                          <button key={opt.score} onClick={()=>{
                            // Fyll opp med "Pickup"-slag til vi når valt score
                            const pos = lastPos;
                            let shots = [...currentShots];
                            while (shots.length < opt.score) {
                              shots.push({ club: "Pickup", pos, distance: null, toHole: null, shotNumber: shots.length + 1, pickup: true });
                            }
                            setHoles(prev => [...prev, { hole: currentHole, shots, pickup: true }]);
                            setCurrentShots([]);
                            const endNote = advanceHole() || "";
                            setMessage(`🏳️ Hol ${currentHole} pickup — ${opt.score} slag (${opt.label})${endNote}`);
                            window.scrollTo({ top: 0, behavior: "smooth" });
                          }} style={{
                            padding: "10px 16px", borderRadius: 8, cursor: "pointer",
                            background: opt.score === par * 2 ? "#ffebee" : "#fff",
                            border: opt.score === par * 2 ? "2px solid #cc4444" : "1px solid #ccc",
                            fontSize: 14, fontWeight: 700, color: "#1a1a1a",
                          }}>
                            <div>{opt.score}</div>
                            <div style={{ fontSize: 10, color: "#999", fontWeight: 600 }}>{opt.label}</div>
                          </button>
                        ));
                      })()}
                    </div>
                    <button onClick={()=>setShowPickup(false)} style={{ width: "100%", marginTop: 8, padding: "10px", background: "#fff", border: "1px solid #ccc", borderRadius: 8, color: "#666", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Avbryt</button>
                  </div>
                )}

                {/* Køllevelgar — caddie-modus eller full grid.
                    Caddie-modus: appen foreslår kølle basert på distToHole. Brukar
                    blar ◀▶ for å sykle gjennom køller. "Vis alle køller" vekslar
                    mellombels til full grid for dette eine slaget.
                    Alle-modus: grid med alle 9 køller (klassisk visning). */}
                {/* Køllevelgar (nedre).
                    Caddie-modus: forslag + bla + aksept ligg no i den øvste
                    "neste slag"-boksen. Her viser vi berre ein knapp for å opne
                    full grid med alle 9 køller (for manuelt val utanom forslaget).
                    Alle-modus: grid med alle køller. */}
                {(caddieMode && !showAllClubs) ? (
                  <button onClick={()=>setShowAllClubs(true)} style={{
                    width: "100%", padding: "12px", background: "#fff",
                    border: "1px solid #999", borderRadius: 8, color: "#666",
                    fontSize: 14, fontWeight: 600, cursor: "pointer",
                  }}>📋 Vis alle køller</button>
                ) : (
                  <>
                    {showAllClubs && (
                      <button onClick={()=>setShowAllClubs(false)} style={{
                        width: "100%", marginBottom: 8, padding: "10px", background: "#fff",
                        border: "1px solid #999", borderRadius: 8, color: "#666",
                        fontSize: 13, fontWeight: 600, cursor: "pointer",
                      }}>← Tilbake til caddie-forslag</button>
                    )}
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
                      {(driverBlocked ? sortedClubs.filter(c => c !== "Driver") : sortedClubs).map(club => {
                        const disp = CLUB_DISPERSION[club];
                        const usage = clubUsage[club] || 0;
                        return (
                          <button key={club} onClick={()=>{
                            handleSelectClub(club);
                            setShowAllClubs(false); // gå tilbake til caddie etter val
                            setCaddieIndex(null);
                          }} style={{
                            padding: "16px 6px", borderRadius: 10, cursor: "pointer", background: "#fff",
                            border: disp ? "2px solid #e67300" : "2px solid #1a3a25",
                            color: "#1a3a25", fontSize: 18, fontWeight: 700, textAlign: "center",
                            position: "relative",
                          }}>
                            {club}
                            {disp && <div style={{ fontSize: 13, color: "#e67300", fontWeight: 600, marginTop: 2 }}>{disp.carry}m</div>}
                            {usage > 0 && <span style={{ position: "absolute", top: -4, right: -4, width: 18, height: 18, borderRadius: "50%", background: "#1a3a25", color: "#fff", fontSize: 9, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{usage}</span>}
                          </button>
                        );
                      })}
                    </div>
                  </>
                )}
              </div>
            )}

            {/* Map step — vel anna kølle */}
            {step === "map" && (
              <button onClick={()=>{setStep("club");setSelectedClub(null);}} style={{
                width: "100%", marginTop: 6, padding: "12px", background: "#fff", border: "2px solid #ccc",
                borderRadius: 8, color: "#666", fontSize: 14, fontWeight: 600, cursor: "pointer",
              }}>← Vel anna kølle</button>
            )}

            {/* Angre */}
            {currentShots.length > 0 && step === "club" && (
              <button onClick={undoLast} style={{ width: "100%", marginTop: 10, padding: "12px", background: "#fff", border: "2px solid #ccc", borderRadius: 10, color: "#666", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>↩ Angre siste slag</button>
            )}
          </>
        )}

        {/* Avslutt runde */}
        {(holes.length>0||currentShots.length>0)&&(
          <div style={{marginTop:20,paddingTop:16,borderTop:"2px solid #ddd"}}>
            {!confirmFinish && !confirmDiscard && (
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                <button onClick={()=>setConfirmFinish(true)} style={{width:"100%",padding:"14px",background:"#fff",border:"2px solid #cc4444",borderRadius:10,color:"#cc4444",fontSize:15,fontWeight:600,cursor:"pointer"}}>Avslutt runde og lagre rapport</button>
                <button onClick={()=>setConfirmDiscard(true)} style={{width:"100%",padding:"10px",background:"#fff",border:"1px solid #bbb",borderRadius:10,color:"#888",fontSize:13,fontWeight:600,cursor:"pointer"}}>🗑 Forkast runde utan å lagre</button>
              </div>
            )}
            {confirmFinish&&!confirmDiscard&&(
              <div style={{background:"#fff",border:"2px solid #cc4444",borderRadius:12,padding:"20px",textAlign:"center"}}>
                <div style={{fontSize:18,fontWeight:700,color:"#1a1a1a",marginBottom:4}}>Avslutte runden?</div>
                <div style={{fontSize:14,color:"#666",marginBottom:16}}>{holes.length} hol · {totalScore} slag</div>
                {/* Tre stabla knappar (01.09.2026). Tre knappar på rad blir for
                    smale på iPhone 13. "Juster fyrst" lagrar utan å sende, slik
                    at straffeslag kan etterregistrerast i historikk-fana før
                    runda blir sendt til Sheets. */}
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  <button onClick={()=>finishRound(true)} disabled={isSending} style={{width:"100%",padding:"14px",background:isSending?"#999":"#cc4444",border:isSending?"2px solid #999":"2px solid #cc4444",borderRadius:8,color:"#fff",fontSize:16,fontWeight:700,cursor:isSending?"not-allowed":"pointer",opacity:isSending?0.7:1}}>{isSending?"📤 Sender...":"📄 Avslutt og send til Sheets"}</button>
                  <button onClick={()=>finishRound(false)} disabled={isSending} style={{width:"100%",padding:"14px",background:"#fff",border:"2px solid #cc6600",borderRadius:8,color:"#cc6600",fontSize:15,fontWeight:700,cursor:isSending?"not-allowed":"pointer",opacity:isSending?0.5:1}}>✏️ Avslutt — juster fyrst</button>
                  <button onClick={()=>setConfirmFinish(false)} disabled={isSending} style={{width:"100%",padding:"12px",background:"#fff",border:"2px solid #ccc",borderRadius:8,color:"#666",fontSize:15,fontWeight:600,cursor:isSending?"not-allowed":"pointer"}}>Avbryt</button>
                </div>
              </div>
            )}
            {confirmDiscard&&(
              <div style={{background:"#fff",border:"2px solid #999",borderRadius:12,padding:"20px",textAlign:"center"}}>
                <div style={{fontSize:18,fontWeight:700,color:"#1a1a1a",marginBottom:4}}>Forkaste runden?</div>
                <div style={{fontSize:14,color:"#666",marginBottom:4}}>{holes.length} hol · {totalScore} slag</div>
                <div style={{fontSize:13,color:"#cc4444",marginBottom:16}}>Data blir ikkje lagra og kan ikkje hentast tilbake.</div>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>setConfirmDiscard(false)} style={{flex:1,padding:"14px",background:"#fff",border:"2px solid #ccc",borderRadius:8,color:"#666",fontSize:15,fontWeight:600,cursor:"pointer"}}>Avbryt</button>
                  <button onClick={()=>{
                    // Nullstill all rundedata utan å lagre
                    setHoles([]); setCurrentHole(startHole); setCurrentShots([]);
                    setSelectedClub(null); setCaddieIndex(null);
                    setStep("club"); setLastPos(teePositions[startHole-1]);
                    setConfirmFinish(false); setConfirmDiscard(false);
                    setConfirmStraff(false); setAimPoint(null); setAimMode(false);
                    setShowPickup(false); setShowPuttPicker(false); setPendingPutts(null);
                    try { localStorage.removeItem(`golf-${course}-active-round`); } catch(e){}
                    setMessage("🗑 Runde forkasta");
                  }} style={{flex:2,padding:"14px",background:"#666",border:"2px solid #666",borderRadius:8,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>🗑 Forkast runde</button>
                </div>
              </div>
            )}
          </div>
        )}


        {/* CALIBRATE VIEW — 9 greener (delte mellom hol 1-9 og 10-18) */}
        {view==="calibrate"&&(
          <div>
            <div style={{fontSize:13,color:"#666",fontWeight:700,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.08em"}}>Innstillingar</div>

            {/* Kurs-veljar */}
            <div style={{background:"#fff",border:"2px solid #1a3a25",borderRadius:10,padding:"14px",marginBottom:14}}>
              <div style={{fontSize:14,fontWeight:700,color:"#1a3a25",marginBottom:8}}>🏌️ Bane</div>
              {(() => {
                const roundActive = holes.length > 0 || currentShots.length > 0;
                /**
                 * Utfører sjølve kursbyttet. Slettar aktiv runde på det gamle
                 * kurset eksplisitt — tidlegare vart berre state nullstilt, så
                 * `golf-<gammalt>-active-round` låg att i localStorage og
                 * oppstartseffekten henta runden opp att (og bytte kurs tilbake)
                 * ved neste innlasting (retta 02.09.2026).
                 */
                const switchCourse = (id) => {
                  try { localStorage.removeItem(`golf-${course}-active-round`); } catch(e){}
                  setCourse(id);
                  setHoles([]); setCurrentShots([]); setCaddieIndex(null);
                  setCurrentHole(1);
                  setLoop("front");
                  // Nullstill lastPos til hol 1-tee på det nye kurset.
                  // course-effekten oppdaterer greens/rapportar automatisk,
                  // men lastPos må setjast direkte fordi kurs-avhengige
                  // tee-koordinatar ikkje er tilgjengelege via state enno.
                  const newTee = id === "sandane" ? TEE_POSITIONS_YELLOW_SANDANE[0] : TEE_POSITIONS_YELLOW[0];
                  setLastPos(newTee);
                  setAimPoint(null); setAimMode(false); setStep("club"); setSelectedClub(null);
                  setConfirmFinish(false); setConfirmDiscard(false); setConfirmStraff(false);
                  setShowPickup(false); setShowPuttPicker(false); setPendingPutts(null);
                  setPendingCourse(null);
                  try { localStorage.setItem("golf-course", id); } catch(e){}
                };
                return (<>
              <div style={{display:"flex",gap:8}}>
                {[{id:"sunnfjord",label:"Sunnfjord GK"},{id:"sandane",label:"Sandane GK"}].map(({id,label})=>(
                  <button key={id} onClick={()=>{
                    if (id === course) return;
                    if (roundActive) { setPendingCourse(id); return; }
                    switchCourse(id);
                  }} style={{
                    flex:1, padding:"10px", borderRadius:8, cursor:"pointer", fontSize:13, fontWeight:700,
                    background: course === id ? "#1a3a25" : "#fff",
                    border: course === id ? "2px solid #1a3a25" : "2px solid #999",
                    color: course === id ? "#fff" : "#666",
                  }}>{label}</button>
                ))}
              </div>
              {pendingCourse && (
                <div style={{marginTop:10,background:"#fff",border:"2px solid #cc4444",borderRadius:10,padding:"14px",textAlign:"center"}}>
                  <div style={{fontSize:15,fontWeight:700,color:"#1a1a1a",marginBottom:4}}>Byte bane?</div>
                  <div style={{fontSize:13,color:"#cc4444",marginBottom:12}}>
                    Du har ei påbegynt runde ({holes.length} hol · {totalScore + currentShots.length} slag). Ho blir forkasta utan å lagrast.
                  </div>
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={()=>setPendingCourse(null)} style={{flex:1,padding:"12px",background:"#fff",border:"2px solid #ccc",borderRadius:8,color:"#666",fontSize:14,fontWeight:600,cursor:"pointer"}}>Avbryt</button>
                    <button onClick={()=>switchCourse(pendingCourse)} style={{flex:2,padding:"12px",background:"#cc4444",border:"2px solid #cc4444",borderRadius:8,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>Forkast runde og byt bane</button>
                  </div>
                </div>
              )}
                </>);
              })()}
              {course === "sandane" && (
                <div style={{fontSize:11,color:"#e67300",marginTop:8}}>
                  ⚠️ Par og indeks for Sandane er foreløpig placeholder-verdiar.
                </div>
              )}
            </div>

            {/* Caddie-modus bryter */}
            <div style={{background:"#fff",border:"2px solid #1a3a25",borderRadius:10,padding:"14px",marginBottom:14}}>
              <div style={{fontSize:14,fontWeight:700,color:"#1a3a25",marginBottom:4}}>🎯 Caddie-modus</div>
              <div style={{fontSize:12,color:"#666",marginBottom:10,lineHeight:1.5}}>
                Når på: appen foreslår kølle basert på avstand til green. Du kan bla
                ◀▶ for å sjå alternativ. Når av: alle 9 køller vises i grid (klassisk).
              </div>
              <button onClick={()=>{
                const newMode = !caddieMode;
                setCaddieMode(newMode);
                setCaddieIndex(null);
                setShowAllClubs(false);
                try { localStorage.setItem("golf-caddie-mode", String(newMode)); } catch(e){}
              }} style={{
                width:"100%", padding:"12px", borderRadius:8, cursor:"pointer", fontSize:14, fontWeight:700,
                background: caddieMode ? "#1a3a25" : "#fff",
                border: caddieMode ? "2px solid #1a3a25" : "2px solid #999",
                color: caddieMode ? "#fff" : "#666",
              }}>
                {caddieMode ? "✓ Caddie-modus PÅ" : "Caddie-modus AV"}
              </button>
            </div>

            <div style={{fontSize:13,color:"#666",fontWeight:700,marginBottom:10,textTransform:"uppercase",letterSpacing:"0.08em"}}>Kalibrer green-posisjonar</div>
            <div style={{fontSize:13,color:"#666",marginBottom:10,lineHeight:1.5}}>
              {course === "sandane"
                ? "Sandane GK 9 hols. Vel green, trykk «Plasser green» og trykk på kartet."
                : "9-hols bane med 18 utslag. Vel green, trykk «Plasser green» og trykk på kartet. Tee-posisjonane er GPS-oppmålte og faste."
              }
            </div>

            <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:10}}>
              {GREEN_PAIRS.map(([a,b])=>{
                const greenIdx = a;
                const isActive = calHole === a+1;
                const g = greenPositions[greenIdx];
                const tA = teePositions[a];
                const tB = b !== undefined ? teePositions[b] : null;
                const distA = tA && g ? Math.round(haversineDistance(tA.lat,tA.lon,g.lat,g.lon)) : "–";
                const distB = tB && g ? Math.round(haversineDistance(tB.lat,tB.lon,g.lat,g.lon)) : "–";
                const holLabel = b !== undefined ? `Hol ${a+1} / ${b+1}` : `Hol ${a+1}`;
                const distLabel = b !== undefined ? `${distA}m / ${distB}m` : `${distA}m`;
                return (
                  <button key={a} onClick={()=>{setCalHole(a+1);setCalStep(null);}} style={{
                    padding:"10px 14px",borderRadius:8,cursor:"pointer",textAlign:"left",
                    background:isActive?"#e8f5e9":"#fff",
                    border:isActive?"2px solid #1a3a25":"1px solid #ddd",
                    display:"flex",alignItems:"center",gap:10,
                  }}>
                    <span style={{width:36,height:36,borderRadius:"50%",background:isActive?"#1a3a25":"#eee",color:isActive?"#fff":"#1a3a25",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:14,flexShrink:0}}>⛳</span>
                    <div style={{flex:1}}>
                      <div style={{fontSize:14,fontWeight:700,color:"#1a3a25"}}>{holLabel}</div>
                      <div style={{fontSize:11,color:"#666"}}>Par {courseData[a].par} · {distLabel}</div>
                    </div>
                    {g && <div style={{fontSize:10,color:"#999",textAlign:"right"}}>{g.lat.toFixed(4)}<br/>{g.lon.toFixed(4)}</div>}
                  </button>
                );
              })}
            </div>

            <div style={{marginBottom:10}}>
              <GolfMap currentHole={calHole} lastPos={null} onPlaceBall={()=>{}} currentShots={[]} holes={[]} teePositions={teePositions} greenPositions={greenPositions} calibrateMode={true} calibrateStep={calStep} onCalibrateTap={handleCalibrateTap} selectedClub={null} aimPoint={null} courseCenter={activeCourseCenter} holeIntermediates={osmIntermediates} />
            </div>

            {(()=>{
              const pair = GREEN_PAIRS.find(p => p[0] === calHole-1 || p[1] === calHole-1);
              const pairLabel = pair && pair.length === 2 ? `${pair[0]+1}/${pair[1]+1}` : calHole;
              return <button onClick={()=>setCalStep("green")} style={{
                width:"100%",padding:"16px",borderRadius:10,cursor:"pointer",fontWeight:700,fontSize:15,
                background:calStep==="green"?"#fff3cd":"#fff",
                border:calStep==="green"?"3px solid #e6a800":"2px solid #1a3a25",
                color:calStep==="green"?"#8a6500":"#1a3a25",marginBottom:10,
              }}>{calStep==="green"?`👆 Trykk på kartet for å plassere green ${pairLabel}`:`⛳ Plasser green for hol ${pairLabel}`}</button>;
            })()}

            <button onClick={resetCalibration} style={{width:"100%",padding:"12px",background:"#fff",border:"2px solid #cc4444",borderRadius:10,color:"#cc4444",fontSize:13,fontWeight:600,cursor:"pointer",marginBottom:20}}>Nullstill alle green-posisjonar til standard</button>

            {/* Google Sheets oppsett */}
            <div style={{fontSize:13,color:"#666",fontWeight:700,marginBottom:10,marginTop:10,textTransform:"uppercase",letterSpacing:"0.08em"}}>Google Sheets</div>
            <div style={{fontSize:11,color:"#2d8a4e",marginBottom:10,fontWeight:600}}>
              ✅ Google Sheets aktiv — du vel «send no» eller «juster fyrst» når runda blir avslutta
            </div>
          </div>
        )}
        {/* Rapportar */}
        {view==="reports"&&(
          <div>
            <div style={{fontSize:13,color:"#666",fontWeight:700,marginBottom:14,textTransform:"uppercase",letterSpacing:"0.08em"}}>Lagra rapportar</div>
            {sheetsStatus && (
              <div style={{
                padding:"10px 14px",marginBottom:10,borderRadius:8,fontSize:13,fontWeight:600,
                background: sheetsStatus==="ok"?"#e8f5e9":(sheetsStatus==="sending"||sheetsStatus==="pending")?"#fff8e1":"#ffebee",
                border: `2px solid ${sheetsStatus==="ok"?"#4a8c5c":(sheetsStatus==="sending"||sheetsStatus==="pending")?"#e6a800":"#cc4444"}`,
                color: sheetsStatus==="ok"?"#1a3a25":sheetsStatus==="error"?"#cc4444":"#8a6500",
              }}>
                {sheetsStatus==="sending"&&"📤 Sender til Google Sheets..."}
                {sheetsStatus==="ok"&&"✅ Rundedata sendt til Google Sheets"}
                {sheetsStatus==="error"&&"❌ Klarte ikkje sende til Google Sheets"}
                {sheetsStatus==="pending"&&"✏️ Runda er lagra lokalt. Legg til eventuelle straffeslag, og trykk «Send til Google Sheets»."}
              </div>
            )}
            {savedReports.length===0?<div style={{textAlign:"center",color:"#999",padding:30,fontSize:14}}>Ingen rapportar enno</div>
            :savedReports.map((r,i)=><ReportItem key={`${r.date}-${r.time}-${i}`} report={r} index={i} savedReports={savedReports} setSavedReports={setSavedReports} setSheetsStatus={setSheetsStatus} course={course} tee={tee} teePositions={teePositions} greenPositions={greenPositions} courseData={courseData}/>)}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GolfShotTracker />);
</script>
</body>
</html>
