// Finn kølla med totalavstand nærast mål-avstanden (absolutt verdi).
// Klampar: viss målet er > Driver, returner Driver. Viss < SW, returner SW.
// Returnerer kølle-namn (string).
function findNearestClub(targetMeters) {
  if (targetMeters >= CLUB_TOTAL["Driver"]) return "Driver";
  if (targetMeters <= CLUB_TOTAL["SW"]) return "SW";
  let best = CADDIE_CLUBS[0];
  let bestDiff = Math.abs(CLUB_TOTAL[best] - targetMeters);
  for (const club of CADDIE_CLUBS) {
    const d = Math.abs(CLUB_TOTAL[club] - targetMeters);
    if (d < bestDiff) { bestDiff = d; best = club; }
  }
  return best;
}

// Returnerer indeks i CADDIE_CLUBS for ein gitt kølle. -1 viss ikkje funne.

// Rekn ut punkt langs ein retning frå ei startposisjon
function pointAtDistanceAndBearing(lat, lon, distMeters, bearingRad) {
  const R = 6371000;
  const d = distMeters / R;
  const lat1 = lat * Math.PI / 180;
  const lon1 = lon * Math.PI / 180;
  const lat2 = Math.asin(Math.sin(lat1)*Math.cos(d) + Math.cos(lat1)*Math.sin(d)*Math.cos(bearingRad));
  const lon2 = lon1 + Math.atan2(Math.sin(bearingRad)*Math.sin(d)*Math.cos(lat1), Math.cos(d)-Math.sin(lat1)*Math.sin(lat2));
  return { lat: lat2 * 180 / Math.PI, lon: lon2 * 180 / Math.PI };
}

// Rekn ut retning (bearing) mellom to punkt
function calcBearing(lat1, lon1, lat2, lon2) {
  const p = Math.PI / 180;
  const dLon = (lon2 - lon1) * p;
  const y = Math.sin(dLon) * Math.cos(lat2 * p);
  const x = Math.cos(lat1 * p) * Math.sin(lat2 * p) - Math.sin(lat1 * p) * Math.cos(lat2 * p) * Math.cos(dLon);
  return Math.atan2(y, x);
}

// Generer ellipse-polygon (array av lat/lon-punkt)
function generateEllipse(fromLat, fromLon, bearingRad, carry, carryStd, sideBias, sideStd, numPoints = 36) {
  const points = [];
  for (let i = 0; i <= numPoints; i++) {
    const angle = (i / numPoints) * 2 * Math.PI;
    // Ellipse i lokal frame: x = sidevegs, y = framover
    const localX = sideBias + sideStd * Math.cos(angle);
    const localY = carry + carryStd * Math.sin(angle);
    // Roter til bearing
    const dx = localX * Math.cos(bearingRad) + localY * Math.sin(bearingRad);
    const dy = -localX * Math.sin(bearingRad) + localY * Math.cos(bearingRad);
    // Konverter til lat/lon (forenkla: 1 grad lat ≈ 111320m, lon justert for breiddegrad)
    const mPerDegLat = 111320;
    const mPerDegLon = 111320 * Math.cos(fromLat * Math.PI / 180);
    points.push([fromLat + dy / mPerDegLat, fromLon + dx / mPerDegLon]);
  }
  return points;
}

// Finn neste sikte-mål basert på OSM hole-line. Logikk:
//   1. Hent mellomnodene for gjeldande hol
//   2. For kvar mellomnode: sjekk om den er framom brukaren i retning mot green
//   3. Returner næraste node som er framom (i retning mot green)
//   4. Viss ingen mellomnoder framom (du har passert alle): returner green
// Dette gjer at ellipsen siktar mot kne-punkt på dogleg når du står på tee,
// og mot green når du er forbi knepunktet.
function findNextAimTarget(fromPos, holeIndex, greenPos) {
  const intermediates = OSM_HOLE_INTERMEDIATES[holeIndex];
  if (!intermediates || intermediates.length === 0) return greenPos;

  // For kvar mellomnode: rekn ut avstand frå fromPos til node og frå node til green.
  // Vi vil sikta mot første node der avstand-frå-fromPos < avstand-frå-fromPos-til-green
  // OG der noden ligg "framom" deg (nærmare green enn deg sjølv).
  const distFromToGreen = haversineDistance(fromPos.lat, fromPos.lon, greenPos.lat, greenPos.lon);
  for (const node of intermediates) {
    const distFromToNode = haversineDistance(fromPos.lat, fromPos.lon, node.lat, node.lon);
    const distNodeToGreen = haversineDistance(node.lat, node.lon, greenPos.lat, greenPos.lon);
    // Noden er framom oss viss han er nærare green enn vi er.
    // Og vi siktar mot han viss vi enno ikkje har nådd han (avstand til node > 5m).
    if (distNodeToGreen < distFromToGreen && distFromToNode > 5) {
      return node;
    }
  }
  // Alle mellomnoder er passert — sikta mot green
  return greenPos;
}

function haversineDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function scoreLabel(score, par) {
  const diff = score - par;
  return diff <= -2 ? "Eagle" : diff === -1 ? "Birdie" :
    diff === 0 ? "Par" : diff === 1 ? "Bogey" :
    diff === 2 ? "Dbl-bogey" : `+${diff}`;
}

// ─── GPS-posisjonering ───
// Returnerer Promise med {lat, lon, accuracy} eller throw med forståeleg norsk feilmelding.
// Tilpassa iOS Safari: enableHighAccuracy for GPS-chip, lang timeout for kald start,
// maximumAge 0 for å tvinge fresh fix (viktig når du går mellom slag).
function getCurrentGPSPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error("Eininga støttar ikkje GPS"));
      return;
    }
    // Sjekk HTTPS — vanlegaste feilkjelde på iOS
    if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
      reject(new Error("GPS krev HTTPS. Opne appen via ein https-adresse (t.d. GitHub Pages)"));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (p) => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, accuracy: p.coords.accuracy }),
      (err) => {
        let msg;
        switch (err.code) {
          case 1: msg = "GPS-tilgang avslege. Innstillingar → Safari → Posisjon → «Be om tilgang»"; break;
          case 2: msg = "Fann ikkje GPS-signal. Gå ut på ope felt og prøv igjen"; break;
          case 3: msg = "GPS brukte for lang tid. Stå stille og prøv igjen"; break;
          default: msg = `GPS-feil: ${err.message || "ukjend"}`;
        }
        reject(new Error(msg));
      },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  });
}

// ─── Google Sheets integrasjon ───
// Sett inn URL-en frå Google Apps Script her:
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbyemoX3aH6vuz_1ZqbC4HyjBd3zmICQnWmb1OZQV-O3Kd5wnsT2CjIhrReMmqaBVu-F/exec";

async function sendToSheets(roundData) {
  if (!SHEETS_URL) return { ok: false, error: "Ingen URL" };
  try {
    await fetch(SHEETS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(roundData),
    });
    return { ok: true };
  } catch (error) {
    return { ok: false, error: error.message };
  }
}
